<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de Ajuste Elástico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Tema oscuro, en la línea del Área de Miembros, con los colores de Ajuste Elástico */
  --fondo:#111214; --sup:#1B1C20; --sup2:#24262B; --linea:#2E3036;
  --tinta:#EDEEF0; --gris:#9DA2AC; --blanco:#FFFFFF;
  --azul:#5D7BB6; --azul-txt:#A9BEE8; --azul-osc:#3A4F7A; --azul-claro:#22304A; --azul-velo:#1A2232;
  --oxido:#E2643A; --oxido-txt:#F29A78; --oxido-claro:#3A2219; --naranja:#E8834F; --naranja-claro:#33241B;
  --papel:var(--fondo);
  --radio-s:6px; --radio-m:12px;
  --sans:'Source Sans 3', system-ui, sans-serif; --display:'Poppins', system-ui, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);color-scheme:dark;font:400 17px/1.55 var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul-txt);text-underline-offset:3px}
:focus-visible{outline:3px solid var(--naranja);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em}
.suave{color:var(--gris)} .chico{font-size:14px}
.link{color:var(--azul-txt);text-decoration:underline;text-underline-offset:3px}
.link.suave{color:var(--gris)}
.primario{background:#FFFFFF;color:#111214;padding:11px 22px;border-radius:8px;font-weight:600}
.primario:hover{background:#E4E5E8}
.secundario,.boton{display:inline-block;border:1px solid #4A4D55;color:var(--tinta);padding:8px 16px;border-radius:8px;font-weight:600;text-decoration:none;background:var(--sup2);font-size:15px}
.secundario:hover,.boton:hover{background:var(--azul-velo)}

/* Barra */
.barra{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:var(--sup);border-bottom:1px solid var(--linea)}
.marca svg{height:30px;width:auto;display:block}
.barra-der{display:flex;gap:14px;align-items:center;font-size:15px}
.quien{font-weight:600}

/* Entrada */
.entrada{max-width:460px;margin:8vh auto 60px;padding:0 20px}
.entrada h1{font-size:30px;margin-bottom:10px}
.entrada form{display:grid;gap:10px;margin:26px 0}
.entrada label{font-weight:600}
.entrada input{padding:12px 14px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-size:18px}
.entrada .primario{justify-self:start}
.error{color:var(--oxido-txt);margin:0}
.demo{border-left:3px solid var(--naranja);padding:4px 0 4px 16px;margin-top:30px}
.demo ul{margin:6px 0 12px;padding-left:20px}

/* Alumno: camino a la izquierda, video a la derecha (arriba en el celular) */
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,46%);gap:0;max-width:1440px;margin:0 auto}
.alumno{padding:0 40px 120px;min-width:0}
.alumno h2{font-size:20px;margin:0 0 14px}
.panel-video{position:sticky;top:0;align-self:start;height:100vh;padding:24px 28px 24px 0;display:flex;flex-direction:column;gap:10px}
.pv-marco{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--linea)}
.pv-marco iframe,.pv-marco #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.pv-titulo{margin:0;font-family:var(--display);font-weight:500;font-size:15px;color:var(--gris)}

/* Encabezado */
.hero{padding:28px 0 6px}
.hero-prog{margin:0;color:var(--gris);font-size:15px;display:flex;flex-wrap:wrap;gap:4px 16px}
.hero-prog span{color:var(--tinta)}
.hero h1{font-size:clamp(30px,5vw,42px);margin:4px 0 14px;letter-spacing:-.02em}
.estado{display:grid;gap:2px;padding-left:14px;border-left:4px solid var(--azul);margin-bottom:20px}
.estado strong{font-family:var(--display);font-weight:600;font-size:18px;color:var(--azul-txt)}
.estado span{color:var(--gris);font-size:16px}
.estado-meterle{border-left-color:var(--oxido)} .estado-meterle strong{color:var(--oxido-txt)}
.estado-adelantado,.estado-m2{border-left-color:var(--naranja)} .estado-adelantado strong,.estado-m2 strong{color:var(--naranja)}
.estado-pausa{border-left-color:var(--linea)} .estado-pausa strong{color:var(--gris)}
.tira{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tramo{display:grid;gap:6px;min-width:0;align-content:start}
.barra-tramo{height:6px;border-radius:999px;background:var(--sup2);overflow:hidden}
.barra-tramo span{display:block;height:100%;width:calc(var(--lleno) * 100%);background:var(--tinta);border-radius:999px}
.tramo.prox .barra-tramo span{background:var(--naranja)}
.tramo.prox.meterle .barra-tramo span{background:var(--oxido)}
.tramo-txt{display:flex;align-items:center;gap:3px;font-family:var(--display);font-weight:500;font-size:12.5px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tramo-txt svg{width:13px;height:13px;flex:none}
.tramo.tuvo .tramo-txt,.tramo.prox .tramo-txt{color:var(--tinta)}
.tramo.prox .tramo-txt{font-weight:600}
.tramo-sub{font-size:12px;color:var(--naranja);margin-top:-4px;font-weight:600}
.tramo.meterle .tramo-sub{color:var(--oxido-txt)}
.tira.animar .barra-tramo span{animation:llenar .9s cubic-bezier(.3,.7,.2,1) both}
@keyframes llenar{from{width:0}}
.clase-hecha{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:15px}
.clase-hecha p{margin:0;width:100%;font-weight:600}

.nota{margin:22px 0 0;padding:14px 18px;background:var(--naranja-claro);border-left:3px solid var(--naranja);border-radius:0 var(--radio-m) var(--radio-m) 0}
.nota p{margin:0}
.nota cite{display:block;font-style:normal;font-size:14px;color:var(--naranja);font-weight:600;margin-top:6px}
.de-andy{margin-top:24px}
.extra{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--sup);border-radius:var(--radio-m);margin-bottom:8px;cursor:pointer;border:1px solid var(--naranja)}
.extra input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--naranja);flex:none}

/* El camino */
.camino{position:relative;margin-top:34px;padding-bottom:10px}
.trazo{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.trazo-base{fill:none;stroke:#3A3D45;stroke-width:3;stroke-dasharray:2 9;stroke-linecap:round}
.trazo-hecho{fill:none;stroke:var(--naranja);stroke-width:4;stroke-linecap:round;opacity:.9}
.etapa-label{position:relative;z-index:1;margin:30px 0 12px 64px;background:var(--fondo);padding:4px 10px 4px 0;width:max-content;max-width:calc(100% - 64px)}
.etapa-label:first-of-type{margin-top:6px}
.etapa-label h3{font-size:13.5px;font-family:var(--sans);font-weight:600;color:var(--gris);margin:0}
.etapa-label p{margin:0;font-size:13.5px;color:#6E737D}
.nodo{position:relative;margin:0 0 6px calc(var(--ola))}
.nodo-fila{display:flex;align-items:center;gap:14px}
.punto{position:relative;z-index:1;width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:var(--sup2);border:2px solid #3A3D45;color:var(--gris);font-family:var(--display);font-weight:600;font-size:15px;transition:transform .15s}
.punto svg{width:22px;height:22px}
.punto:hover{transform:scale(1.06)}
.est-listo .punto,.est-casi .punto{background:var(--tinta);border-color:var(--tinta);color:#111}
.est-cuesta .punto{border-color:var(--oxido);color:var(--oxido-txt);background:var(--oxido-claro)}
.nodo-tit{text-align:left;padding:6px 4px;display:grid;gap:1px}
.nodo-tit span{font-size:16.5px;line-height:1.3}
.est-listo .nodo-tit span,.est-casi .nodo-tit span{color:var(--gris)}
.nodo-tit small{font-size:14px;color:var(--gris)}
.nodo-tit small.oxido{color:var(--oxido-txt);font-weight:600}
.nodo.abierto{margin:14px 0 22px}
.nodo.abierto .punto{width:58px;height:58px;font-size:18px;background:var(--naranja);border-color:var(--naranja);color:#1B1208;box-shadow:0 0 0 7px rgba(232,131,79,.18)}
.nodo.abierto.est-listo .punto,.nodo.abierto.est-casi .punto{background:var(--naranja);border-color:var(--naranja)}
.nodo.abierto .nodo-tit span{font-family:var(--display);font-weight:600;font-size:22px;color:var(--tinta);line-height:1.2}
.tarjeta{position:relative;z-index:1;margin:12px 0 0 0;background:var(--sup);border:1px solid var(--linea);border-radius:14px;padding:20px 22px 22px;animation:abrir .25s cubic-bezier(.2,.8,.3,1) both}
@keyframes abrir{from{opacity:0;transform:translateY(-6px)}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--azul-claro);color:var(--azul-txt);white-space:nowrap}
.chip svg{width:15px;height:15px}
.chip-oxido{background:var(--oxido-claro);color:var(--oxido-txt)}
.consigna p{margin:0 0 10px;color:#D6D9DF}
.consigna strong{color:var(--tinta)}
.reglas{margin:0 0 12px;padding-left:22px;color:#D6D9DF}
.reglas li{margin:5px 0}
.link-seek{display:inline-flex;align-items:center;gap:4px;color:var(--azul-txt);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.link-seek svg{width:14px;height:14px}
.material{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 6px}
.mat{display:inline-flex;align-items:center;gap:9px;padding:9px 14px;background:var(--sup2);border:1px solid var(--linea);border-radius:10px;color:var(--tinta)!important;text-decoration:none;font-weight:600;font-size:15px;text-align:left}
.mat:hover{border-color:#5A5E68}
.mat svg{width:17px;height:17px;flex:none;color:var(--naranja)}
a.mat svg{color:var(--azul-txt)}
.mat small{display:block;font-weight:400;color:var(--gris);font-size:13px}
.pregunta{margin-top:18px;padding-top:16px;border-top:1px solid var(--linea)}
.pregunta h4{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 10px}
.ops{display:grid;gap:8px}
.op{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:10px;border:1.5px solid var(--linea);background:var(--sup2);font-weight:600;font-size:16px;line-height:1.3;color:var(--tinta)}
.op:hover{border-color:#5A5E68}
.op-punto{width:18px;height:18px;border-radius:50%;border:2px solid #5A5E68;flex:none}
.op.sel{border-color:var(--tinta);background:#2A2C32}
.op.sel .op-punto{border:6px solid var(--tinta)}
.op.sel.nivel-cuesta{border-color:var(--oxido);background:var(--oxido-claro)}
.op.sel.nivel-cuesta .op-punto{border-color:var(--oxido-txt)}
.respuesta{margin-top:12px;padding:12px 14px;border-radius:8px;background:var(--azul-velo);border-left:3px solid var(--azul)}
.respuesta.nivel-cuesta{background:var(--oxido-claro);border-left-color:var(--oxido)}
.respuesta p{margin:0 0 4px}
.apoyo{margin-top:16px;padding:14px 16px;border-radius:10px;background:var(--naranja-claro)}
.apoyo h4,.dificultades h4{margin:0 0 6px;font-family:var(--display);font-weight:600;font-size:15px}
.apoyo>p{margin:0 0 6px;font-size:15.5px;color:#D6D9DF}
.apoyo-item{padding-top:10px}
.apoyo-t{margin:0;font-weight:600}
.apoyo-c{margin:0 0 6px;font-size:14.5px;color:var(--gris)}
.apoyo-links{display:flex;flex-wrap:wrap;gap:8px}
.dificultades{margin-top:16px}
.dif{padding:10px 0;border-top:1px solid var(--linea)}
.dif:first-of-type{border-top:0;padding-top:2px}
.dif p{margin:0 0 4px;color:#D6D9DF}
.dif .dif-q{font-weight:600;color:var(--tinta)}
.dif a{display:inline-block;margin-right:14px}
.seguir{margin-top:18px}
.seguir .primario{display:inline-grid;grid-template-columns:auto auto;align-items:center;gap:0 12px;text-align:left;padding:12px 20px}
.seguir .primario span{font-size:17px}
.seguir .primario small{grid-row:2;font-weight:500;font-size:13.5px;color:#4A4D55;max-width:320px}
.seguir .primario svg{grid-row:1/3;grid-column:2;width:20px;height:20px}
.standards{display:flex;flex-wrap:wrap;gap:8px}
.chip-op{padding:8px 14px;border-radius:999px;border:1.5px solid var(--linea);background:var(--sup2);font-weight:500;font-size:15px;color:var(--tinta)}
.chip-op:hover{border-color:#5A5E68}
.chip-op.sel{background:var(--tinta);border-color:var(--tinta);color:#111;font-weight:600}
.otro-standard{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.otro-standard input{flex:1 1 140px;min-width:0;width:100%;padding:8px 14px;border:1.5px solid var(--linea);border-radius:999px;background:var(--sup2);color:var(--tinta)}
.meta{position:relative;display:flex;align-items:center;gap:14px;margin:26px 0 0 0}
.meta span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:2px dashed #3A3D45;color:#6E737D;background:var(--fondo);position:relative;z-index:1}
.meta span svg{width:20px;height:20px}
.meta p{margin:0;color:#6E737D;font-family:var(--display);font-weight:500}
.pie{margin-top:34px;color:var(--gris);font-size:15px}

@media (max-width:999px){
  .layout{display:flex;flex-direction:column-reverse}
  .panel-video{position:sticky;top:0;z-index:5;height:auto;padding:0;background:var(--fondo);gap:0;width:100%}
  .pv-marco{border-radius:0;border:0;border-bottom:1px solid var(--linea)}
  .pv-titulo{padding:6px 16px;font-size:13.5px;border-bottom:1px solid var(--linea)}
  .alumno{padding:0 18px 100px}
}
@media (max-width:560px){
  .tira{gap:4px}
  .tramo-txt{font-size:11px}
  .nodo{margin-left:calc(var(--ola) * .5)}
  .nodo.abierto{margin-left:0}
  .tarjeta{padding:16px 16px 18px;margin-left:-4px;margin-right:-4px}
  .etapa-label{margin-left:58px;max-width:calc(100% - 58px)}
  .nodo.abierto .nodo-tit span{font-size:19px}
  .punto{width:42px;height:42px}
  .nodo.abierto .punto{width:50px;height:50px}
}

.como{font-size:13px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.como-listo,.como-casi{background:var(--azul-claro);color:var(--azul-txt)}
.como-cuesta{background:var(--oxido-claro);color:var(--oxido-txt)}
/* Aviso de guardado */
#aviso{position:fixed;right:16px;bottom:16px;background:var(--tinta);color:var(--blanco);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
#aviso.visible{opacity:1;transform:none}
#aviso.error{background:var(--oxido)}

/* Panel de Andy */
.admin{max-width:1240px;margin:0 auto;padding:6px 20px 80px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
.lista-cab{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.lista-cab h1{font-size:26px}
.lista table{width:100%;border-collapse:collapse;background:var(--sup);border-radius:var(--radio-m);overflow:hidden;font-size:16px}
.lista th{text-align:left;font-weight:600;font-size:14px;color:var(--gris);padding:10px 12px;border-bottom:1px solid var(--linea)}
.lista td{padding:12px;border-bottom:1px solid var(--linea);vertical-align:top}
.lista tr[data-elegir]{cursor:pointer}
.lista tr[data-elegir]:hover td{background:var(--azul-velo)}
.lista tr.sel td{background:var(--azul-claro)}
.lista td.nw{white-space:nowrap}
.etapa-completa .etapa-cab{padding:12px 0;border-bottom:1px solid var(--linea);margin:0}
.etapa-completa h3::before{content:'';display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--azul);margin-right:10px;vertical-align:middle}
.marca-prob{display:block;font-size:13px;color:var(--oxido-txt);font-weight:600}
.estado-chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;background:var(--azul-claro);color:var(--azul-txt)}
.estado-chip.t-meterle{background:var(--oxido-claro);color:var(--oxido-txt)}
.estado-chip.t-adelantado,.estado-chip.t-m2{background:var(--naranja-claro);color:var(--naranja)}
.estado-chip.t-pausa{background:var(--papel);color:var(--gris);border:1px solid var(--linea)}
.detalle{background:var(--sup);border-radius:var(--radio-m);padding:22px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.vacio{margin:30px 0}
.det-cab{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.det-cab h2{font-size:24px}
.mensaje{margin:18px 0;padding:14px;border:1.5px solid var(--azul-claro);border-radius:var(--radio-s);background:var(--azul-velo)}
.mensaje-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mensaje-cab h3,.bloque h3{font-size:16px}
.mensaje-cab span{display:flex;gap:8px}
.mensaje textarea{width:100%;border:1px solid var(--linea);border-radius:var(--radio-s);padding:10px;font-size:15px;line-height:1.45;background:var(--sup);resize:vertical}
.form-admin{display:grid;gap:12px}
.form-admin label,.bloque{display:grid;gap:4px;font-weight:600;font-size:15px}
.form-admin input,.form-admin select,.bloque textarea,.fila-extra input{padding:8px 10px;border:1.5px solid var(--linea);border-radius:var(--radio-s);background:var(--sup);font-weight:400;font-size:16px}
.form-admin label.check{display:flex;gap:8px;align-items:center;font-weight:400}
.ajustes{grid-template-columns:1fr 1fr;margin-bottom:16px}
.ajustes label.check{grid-column:1/-1}
.segmentado{display:inline-flex;border:1.5px solid var(--linea);border-radius:999px;overflow:hidden;justify-self:start}
.segmentado button{padding:6px 14px;font-weight:600}
.segmentado button.sel{background:var(--azul);color:var(--blanco)}
.bloque{margin-top:20px}
.extras-adm,.probs-adm,.avance-adm{list-style:none;margin:6px 0 0;padding:0;font-weight:400}
.extras-adm li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--linea)}
.extras-adm li>span{flex:1;min-width:0}
.extras-adm li.hecha strong{text-decoration:line-through;color:var(--gris)}
.fila-extra{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin-top:8px}
.probs-adm li{padding:4px 0}
.avance-adm li{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:15px}
.avance-adm li span:nth-child(2){flex:1}
.mini-nodo{width:18px;height:18px;border-radius:50%;border:2px solid var(--linea);background:var(--sup);flex:none}
.avance-adm .est-listo .mini-nodo,.avance-adm .est-casi .mini-nodo{background:var(--azul);border-color:var(--azul-txt)}
.avance-adm .est-cuesta .mini-nodo{background:var(--oxido-claro);border-color:var(--oxido-txt)}
.links-adm{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.links-adm p{width:100%;margin:0}

@media (max-width:900px){
  .admin{grid-template-columns:1fr}
  .detalle{position:static;max-height:none}
  .lista th:nth-child(4),.lista td:nth-child(4),.lista th:nth-child(5),.lista td:nth-child(5){display:none}
}
@media (max-width:560px){
  body{font-size:16.5px}
  .barra{padding:12px 16px}
  .marca svg{height:24px}
  .ajustes{grid-template-columns:1fr}
  .fila-extra{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* =====================================================================
   MOTOR — decide en qué está cada alumno y qué le conviene hacer
   ===================================================================== */
const COLS = ['min', 'esp', 'ideal'];
const ORDEN = PROGRAMA.pasos.map(p => p.id);
const PASO = Object.fromEntries(PROGRAMA.pasos.map(p => [p.id, p]));
const MAX_K = PROGRAMA.clases + 1; // 5 = módulo 2

function requeridos(k, col) {
  const s = new Set();
  for (let j = 1; j <= Math.min(k, MAX_K); j++) {
    for (let c = 0; c <= col; c++) (PROGRAMA.esperado[j]?.[COLS[c]] || []).forEach(id => s.add(id));
  }
  return ORDEN.filter(id => s.has(id));
}

const hecho = (st, id) => !!(st.prog[id] && st.prog[id].hecho && st.prog[id].como !== 'cuesta');
const tocado = (st, id) => !!(st.prog[id] && st.prog[id].hecho);

function diasDesde(fecha) {
  if (!fecha) return 0;
  const d0 = new Date(fecha + 'T12:00:00');
  const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
  return Math.max(0, Math.round((hoy - d0) / 86400000));
}
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function estado(st) {
  const col = clamp((st.nivel || 2) - 1, 0, 2);
  const k = Math.min((st.clase || 0) + 1, MAX_K);
  const R = requeridos(k, col);
  const faltan = R.filter(id => !hecho(st, id));
  // Avance medido sobre lo nuevo de esta clase más lo que haya quedado pendiente de antes.
  // Algo tildado como "me cuesta" cuenta como medio paso.
  const previos = new Set(requeridos(k - 1, col));
  const foco = R.filter(id => !previos.has(id) || !hecho(st, id));
  const peso = id => hecho(st, id) ? 1 : tocado(st, id) ? 0.5 : 0;
  const frac = foco.length ? foco.reduce((s, id) => s + peso(id), 0) / foco.length : 1;
  const pre = k === 1;
  const d = diasDesde(pre ? st.inicio : (st.claseFecha || st.inicio));
  // Cuánto se espera tener hecho a esta altura (0 a 1).
  // Pre-sincrónico: libre los 2 primeros días, completo al día 10.
  // Entre clases: libre el primer día, completo al día 6.
  const esperadoAhora = pre ? clamp((d - 2) / 8, 0, 1) : clamp((d - 1) / 5, 0, 1);
  let tipo;
  if (k === MAX_K && faltan.length === 0) tipo = 'm2';
  else if (st.pausa) tipo = 'pausa';
  else if (faltan.length === 0) {
    const idealOk = requeridos(k, 2).every(id => hecho(st, id));
    tipo = (col < 2 && idealOk) || (k < MAX_K && requeridos(k + 1, col).some(id => hecho(st, id) && !R.includes(id))) ? 'adelantado' : 'bien';
  } else if (frac + 0.15 < esperadoAhora || esperadoAhora >= 1) tipo = 'meterle';
  else tipo = 'bien';
  return { k, col, R, faltan, frac, d, esperadoAhora, tipo, pre };
}

/* Recomendaciones: el primero es el recomendado, el resto son alternativas */
function recomendaciones(st, n = 3) {
  const e = estado(st);
  const out = []; const ya = new Set();
  const push = (id, motivo) => { if (!ya.has(id) && PASO[id]) { ya.add(id); out.push({ id, motivo }); } };
  e.R.filter(id => st.prog[id]?.como === 'cuesta').forEach(id => push(id, 'seguir'));
  e.faltan.forEach(id => push(id, 'falta'));
  if (out.length < n) requeridos(e.k, 2).filter(id => !hecho(st, id)).forEach(id => push(id, 'extra'));
  if (out.length < n && e.k < MAX_K) requeridos(e.k + 1, e.col).filter(id => !hecho(st, id)).forEach(id => push(id, 'extra'));
  if (out.length < n) ORDEN.filter(id => !hecho(st, id) && !PASO[id].opcional).forEach(id => push(id, 'extra'));
  return { e, lista: out.slice(0, n) };
}

/* Posición en el mapa: 0 = inicio, 1..4 = listo para la clase N, 5 = módulo 2 */
function posicion(st) {
  const col = clamp((st.nivel || 2) - 1, 0, 2);
  let base = 0;
  for (let i = 1; i <= MAX_K; i++) {
    if (requeridos(i, col).every(id => hecho(st, id))) base = i; else break;
  }
  if (base >= MAX_K) return MAX_K;
  const prev = new Set(requeridos(base, col));
  const sig = requeridos(base + 1, col).filter(id => !prev.has(id));
  const f = sig.length ? sig.filter(id => hecho(st, id)).length / sig.length : 0;
  return base + f * 0.85;
}

/* Mensaje de WhatsApp en el estilo de Andy */
function mensajeWhatsApp(st, link) {
  const { e, lista } = recomendaciones(st, 4);
  const nombre = (st.nombre || '').split(' ')[0];
  const cab = e.k >= MAX_K ? `${nombre}! Te dejo pasos a seguir 🙌` : `${nombre}! Te dejo pasos a seguir para la clase ${e.k} 🙌`;
  const items = [];
  (st.extras || []).filter(x => !x.hecho).forEach(x => items.push(`${x.titulo}${x.detalle ? '\n' + x.detalle : ''}`));
  lista.forEach(r => {
    const p = PASO[r.id];
    const icono = p.entrega === 'audio' ? '🎧' : '📹';
    items.push(`${p.titulo}${r.motivo === 'seguir' ? ' (seguimos con esto)' : ''}\n${p.detalle}${p.entrega ? `\nMandar ${p.entrega} ${icono}` : ''}`);
  });
  let txt = cab + '\n\n' + items.slice(0, 4).map((t, i) => `${i + 1}) ${t}`).join('\n\n');
  if (st.nota) txt += '\n\n' + st.nota;
  if (link) txt += `\n\nEn tu mapa vas tildando lo que hacés: ${link}`;
  return txt;
}

/* ---------- API ---------- */
async function llamar(accion, datos) {
  if (!API_URL) return demo(accion, datos);
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                   body: JSON.stringify({ accion, ...datos }) });
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}

function demo(accion, d) {
  const db = leerDemo();
  const buscar = c => db.alumnos.find(a => a.codigo === (c || '').trim().toLowerCase());
  switch (accion) {
    case 'alumno.get': { const a = buscar(d.codigo); if (!a) throw new Error('No encontramos ese código. Revisá que esté bien escrito o pedíselo a Andy.'); return { alumno: JSON.parse(JSON.stringify(a)) }; }
    case 'alumno.guardar': {
      const a = buscar(d.codigo); if (!a) throw new Error('Código inválido');
      ['prog', 'probs', 'clase', 'claseFecha', 'standard'].forEach(k => { if (k in d.cambios) a[k] = d.cambios[k]; });
      if (d.cambios.extras) a.extras = a.extras.map(x => ({ ...x, hecho: !!(d.cambios.extras.find(y => y.id === x.id) || {}).hecho }));
      a.act = hoyISO(); escribirDemo(); return { ok: true };
    }
    case 'admin.lista': return { alumnos: JSON.parse(JSON.stringify(db.alumnos)) };
    case 'admin.guardar': {
      const i = db.alumnos.findIndex(a => a.codigo === d.alumno.codigo);
      if (i >= 0) db.alumnos[i] = d.alumno; else db.alumnos.push(d.alumno);
      escribirDemo(); return { ok: true };
    }
    case 'admin.borrar': { db.alumnos = db.alumnos.filter(a => a.codigo !== d.codigo); escribirDemo(); return { ok: true }; }
    case 'demo.reset': { memoria = semillaDemo(); escribirDemo(); return { ok: true }; }
  }
  throw new Error('Acción desconocida');
}

  video: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></svg>',
  doc: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z M14 3v5h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 13h6M10 16.5h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  enviar: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l16-7-6 15-2.5-6.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 12.5l4 4 9-9.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  abajo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const ytId = url => { const m = String(url || '').match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m ? m[1] : null; };
const ytT = url => { const m = String(url || '').match(/[?&](?:t|start)=(\d+)/); return m ? +m[1] : 0; };
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

function titularEstado(e) {
  return { bien: 'Vas bien', meterle: 'Hay que meterle un poco', adelantado: 'Vas adelantado', pausa: 'Sin apuro', m2: 'Ya estás en el módulo 2' }[e.tipo];
}
function etiquetaAdmin(e) {
  return { bien: 'Va bien', meterle: 'Hay que meterle', adelantado: 'Adelantado', pausa: 'En pausa', m2: 'En módulo 2' }[e.tipo];
}
function bajadaEstado(st, e) {
  const proxima = e.k <= 4 ? `la clase ${e.k}` : 'lo que sigue';
  const nombres = ids => ids.slice(0, 3).map(id => PASO[id].titulo.toLowerCase()).join(', ').replace(/, ([^,]*)$/, ' y $1');
  if (e.tipo === 'm2') return 'Terminaste el módulo 1. El resto del módulo 2 lo seguimos por WhatsApp mientras se suma al mapa.';
  if (e.tipo === 'pausa') return 'Andy dejó tu mapa en pausa. Avanzá cuando puedas, sin presión.';
  if (e.tipo === 'meterle') return `Para ${proxima} conviene tener: ${nombres(e.faltan)}${e.faltan.length > 3 ? ', entre otras' : ''}.`;
  if (e.tipo === 'adelantado') return `Ya tenés lo necesario para ${proxima}. Si tenés ganas, podés seguir con lo que viene.`;
  if (e.faltan.length === 0) return `Ya tenés lo necesario para ${proxima}.`;
  return `Para ${proxima} te ${e.faltan.length === 1 ? 'queda' : 'quedan'} ${e.faltan.length} ${e.faltan.length === 1 ? 'paso' : 'pasos'}.`;
}

function tiraClases(st, e, animar) {
  const p = posicion(st);
  const tramos = ['Clase 1', 'Clase 2', 'Clase 3', 'Clase 4', 'Módulo 2'];
  return `<ol class="tira ${animar && !reduceMotion ? 'animar' : ''}" aria-label="Tu camino en el módulo">
    ${tramos.map((t, i) => {
      const n = i + 1, lleno = clamp(p - i, 0, 1), tuvo = n <= (st.clase || 0) && n <= 4, prox = n === e.k;
      return `<li class="tramo ${tuvo ? 'tuvo' : prox ? 'prox' : ''} ${prox && e.tipo === 'meterle' ? 'meterle' : ''}">
        <span class="barra-tramo"><span style="--lleno:${lleno}"></span></span>
        <span class="tramo-txt">${tuvo ? ICONO.check : ''}${t}</span>
        ${prox && e.tipo !== 'm2' ? '<span class="tramo-sub">próxima</span>' : ''}
      </li>`;
    }).join('')}
  </ol>`;
}

/* Texto con formato mínimo. Los links a YouTube se vuelven botones que mueven el video de al lado. */
function linkHTML(texto, url) {
  const id = ytId(url);
  if (id) return `<button class="link-seek" data-seek="${id}:${ytT(url)}">${ICONO.video}${texto}</button>`;
  return `<a href="${url}" target="_blank" rel="noopener">${texto}</a>`;
}
function enLinea(l) {
  return esc(l).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => linkHTML(t, u));
}
function textoHTML(t) {
  const out = []; let lista = [];
  const cerrar = () => { if (lista.length) { out.push(`<ul class="reglas">${lista.map(l => `<li>${enLinea(l)}</li>`).join('')}</ul>`); lista = []; } };
  String(t || '').split('\n').forEach(l => { if (l.startsWith('- ')) lista.push(l.slice(2)); else { cerrar(); if (l.trim()) out.push(`<p>${enLinea(l)}</p>`); } });
  cerrar(); return out.join('');
}

function opcionesProgreso(p) { return p.progreso || (p.sinProgreso ? PROGRESO_SIMPLE : PROGRESO_BASE); }
function opcionElegida(st, p) {
  const pr = st.prog[p.id]; if (!pr) return null;
  return opcionesProgreso(p).find(o => o.id === pr.op) || opcionesProgreso(p).find(o => o.nivel === pr.como) || null;
}
function ayudaPara(p, sel) {
  if (!sel) return { apoyo: false, difs: [] };
  const probs = p.problemas || [];
  if (sel.muestra) return { apoyo: !!p.apoyo && sel.muestra.includes('apoyo'), difs: probs.filter(q => sel.muestra.includes(q.id)) };
  return { apoyo: false, difs: sel.nivel === 'cuesta' ? probs : [] };
}

/* Material: los videos se abren en el reproductor de al lado; los documentos, en otra pestaña */
function materialHTML(p) {
  const rs = (p.recursos || []).filter(r => r.url);
  if (!rs.length) return '';
  return `<div class="material">${rs.map(r => {
    const id = ytId(r.url);
    if (id) { const t = ytT(r.url); return `<button class="mat" data-seek="${id}:${t}">${ICONO.video}<span>${esc(r.t)}${t ? `<small>desde ${mmss(t)}</small>` : ''}</span></button>`; }
    return `<a class="mat" href="${esc(r.url)}" target="_blank" rel="noopener">${ICONO.doc}<span>${esc(r.t)}</span></a>`;
  }).join('')}</div>`;
}
function apoyoHTML(p) {
  return `<div class="apoyo"><h4>${esc(p.apoyo.titulo)}</h4>${p.apoyo.texto ? `<p>${esc(p.apoyo.texto)}</p>` : ''}
    ${p.apoyo.items.map(i => `<div class="apoyo-item"><p class="apoyo-t">${esc(i.t)}</p><p class="apoyo-c">${esc(i.cuando)}</p>
      <div class="apoyo-links">${i.video ? `<button class="mat" data-seek="${ytId(i.video)}:0">${ICONO.video}<span>Ver el video</span></button>` : ''}<a class="mat" href="${esc(i.url)}" target="_blank" rel="noopener">${ICONO.doc}<span>Leer el documento</span></a></div></div>`).join('')}</div>`;
}
function dificultadesHTML(difs) {
  if (!difs.length) return '';
  return `<div class="dificultades"><h4>Dificultades comunes</h4>${difs.map(q => `<div class="dif"><p class="dif-q">${esc(q.q)}</p><p>${esc(q.fix)}</p>
    ${q.url ? linkHTML('Ver esa parte del video', esc(q.url)) : ''}
    ${q.doc ? `<a href="${esc(q.doc.url)}" target="_blank" rel="noopener">${esc(q.doc.t)}</a>` : ''}</div>`).join('')}</div>`;
}

function standardHTML(st) {
  const elegido = st.standard || '';
  const item = STANDARDS.find(x => x.t === elegido);
  return `<div class="pregunta"><h4>¿Con qué tema vas a trabajar?</h4>
    <div class="standards" role="radiogroup" aria-label="Standards">${STANDARDS.map(x => `<button role="radio" aria-checked="${x.t === elegido}" class="chip-op ${x.t === elegido ? 'sel' : ''}" data-standard="${esc(x.t)}">${esc(x.t)}</button>`).join('')}</div>
    <form class="otro-standard" data-form-standard="1"><input name="otro" aria-label="Otro tema" placeholder="Otro tema" value="${item || !elegido ? '' : esc(elegido)}"><button class="secundario">Elegir este</button></form>
    ${elegido ? `<div class="respuesta"><p>Elegiste <strong>${esc(elegido)}</strong>.</p>${item && item.pdf ? `<a href="${esc(item.pdf)}" target="_blank" rel="noopener">Descargar la parte para trabajar (PDF)</a>` : '<p class="suave chico">Andy te pasa la parte para trabajar.</p>'}</div>` : ''}
  </div>`;
}

function preguntaHTML(st, p) {
  if (p.tipo === 'standard') return standardHTML(st);
  const sel = opcionElegida(st, p);
  const ayuda = ayudaPara(p, sel);
  return `<div class="pregunta"><h4>¿Cómo te fue?</h4>
    <div class="ops" role="radiogroup" aria-label="Cómo te fue">
      ${opcionesProgreso(p).map(o => `<button role="radio" aria-checked="${sel === o}" class="op nivel-${o.nivel} ${sel === o ? 'sel' : ''}" data-op="${p.id}:${o.id}"><span class="op-punto"></span>${esc(o.label)}</button>`).join('')}
    </div>
    ${sel && sel.resp ? `<div class="respuesta nivel-${sel.nivel}"><p>${esc(sel.resp)}</p>${sel.url ? linkHTML('Ver el ejemplo del video', esc(sel.url)) : ''}</div>` : ''}
    ${ayuda.apoyo ? apoyoHTML(p) : ''}
    ${dificultadesHTML(ayuda.difs)}
  </div>`;
}

function siguienteDe(id) { const i = ORDEN.indexOf(id); return PASO[ORDEN[i + 1]] || null; }

function tarjetaHTML(st, e, p) {
  const sel = opcionElegida(st, p);
  const sig = siguienteDe(p.id);
  const respondido = p.tipo === 'standard' ? !!st.standard : !!sel;
  const necesario = e.faltan.includes(p.id);
  return `<div class="tarjeta">
    <div class="chips">${p.entrega ? `<span class="chip">${ICONO.enviar}Mandar ${esc(p.entrega)} a Andy</span>` : ''}${necesario ? `<span class="chip ${e.tipo === 'meterle' ? 'chip-oxido' : ''}">Para la clase ${Math.min(e.k, 4)}</span>` : ''}</div>
    <div class="consigna">${textoHTML(p.detalle)}</div>
    ${materialHTML(p)}
    ${preguntaHTML(st, p)}
    ${respondido && sig ? `<div class="seguir">
        ${sel && sel.nivel === 'cuesta'
          ? `<button class="secundario" data-abrir="${sig.id}">Seguir igual con lo que viene</button>`
          : `<button class="primario" data-abrir="${sig.id}"><span>Seguir</span><small>${esc(sig.titulo)}</small>${ICONO.abajo}</button>`}
      </div>` : ''}
  </div>`;
}

const OLAS = [0, 34, 68, 34];
function caminoHTML(st, e) {
  let i = 0;
  return `<div class="camino" id="camino"><svg class="trazo" aria-hidden="true"><path class="trazo-base"/><path class="trazo-hecho"/></svg>
    ${PROGRAMA.etapas.map(et => {
      const pasos = PROGRAMA.pasos.filter(p => p.etapa === et.id);
      const cerrada = et.id === 'm2' && e.k < 4 && !pasos.some(p => tocado(st, p.id));
      return `<div class="etapa-label"><h3>${esc(et.titulo)}</h3><p>${cerrada ? 'Se abre cuando llegues a la clase 4' : esc(et.sub)}</p></div>
      ${cerrada ? '' : pasos.map(p => {
        const n = ++i;
        const pr = st.prog[p.id] || {};
        const est = pr.hecho ? (pr.como || 'listo') : 'pendiente';
        const abiertoEste = p.id === abierto;
        const sel = opcionElegida(st, p);
        const sub = p.tipo === 'standard' && st.standard ? st.standard
          : pr.hecho && sel && pr.como !== 'listo' ? sel.label
          : !pr.hecho && e.faltan.includes(p.id) ? `Para la clase ${Math.min(e.k, 4)}` : '';
        return `<section class="nodo est-${est} ${abiertoEste ? 'abierto' : ''}" id="n-${p.id}" style="--ola:${abiertoEste ? 0 : OLAS[n % OLAS.length]}px">
          <div class="nodo-fila">
            <button class="punto" data-abrir="${p.id}" aria-label="${esc(p.titulo)}">${pr.hecho && pr.como !== 'cuesta' ? ICONO.check : n}</button>
            <button class="nodo-tit" data-abrir="${p.id}" aria-expanded="${abiertoEste}"><span>${esc(p.titulo)}</span>${sub ? `<small class="${!pr.hecho && e.tipo === 'meterle' || pr.como === 'cuesta' ? 'oxido' : ''}">${esc(sub)}</small>` : ''}</button>
          </div>
          ${abiertoEste ? tarjetaHTML(st, e, p) : ''}
        </section>`;
      }).join('')}`;
    }).join('')}
    <div class="meta"><span>${ICONO.check}</span><p>Fin del módulo 1</p></div>
  </div>`;
}

function vistaHTML(st, e, animar) {
  const extrasPend = (st.extras || []).filter(x => !x.hecho);
  return `<header class="hero">
      <p class="hero-prog">${esc(PROGRAMA.programa)}${st.standard ? `<span>Tu standard: ${esc(st.standard)}</span>` : ''}</p>
      <h1>Hola, ${esc(st.nombre.split(' ')[0])}</h1>
      <div class="estado estado-${e.tipo}"><strong>${titularEstado(e)}</strong><span>${esc(bajadaEstado(st, e))}</span></div>
      ${tiraClases(st, e, animar)}
      ${e.k <= 4 ? `<div class="clase-hecha" id="claseHecha"><button class="link suave" data-accion="clase">Ya tuve la clase ${e.k}</button>${st.clase > 0 ? `<button class="link suave" data-accion="deshacer-clase">Todavía no tuve la clase ${st.clase}</button>` : ''}</div>` : ''}
    </header>
    ${st.nota ? `<blockquote class="nota"><p>${esc(st.nota).replace(/\n/g, '<br>')}</p><cite>Andy</cite></blockquote>` : ''}
    ${extrasPend.length ? `<section class="de-andy"><h2>Andy te dejó</h2>${extrasPend.map(x => `
      <label class="extra"><input type="checkbox" data-extra="${esc(x.id)}"><span><strong>${esc(x.titulo)}</strong>${x.detalle ? `<br><span class="suave">${esc(x.detalle)}</span>` : ''}</span></label>`).join('')}</section>` : ''}
    ${caminoHTML(st, e)}
    <p class="pie">Lo que marcás se guarda solo. Andy lo ve antes de cada clase.</p>`;
}

/* ---------- El camino dibujado ---------- */
function dibujarCamino() {
  const cam = $('#camino'); if (!cam) return;
  const svg = cam.querySelector('.trazo');
  const base = cam.getBoundingClientRect();
  const centro = el => { const r = el.getBoundingClientRect(); return [r.left - base.left + r.width / 2, r.top - base.top + r.height / 2]; };
  const puntos = [...cam.querySelectorAll('.punto')].map(centro);
  const meta = cam.querySelector('.meta span'); if (meta) puntos.push(centro(meta));
  svg.setAttribute('width', cam.clientWidth); svg.setAttribute('height', cam.scrollHeight);
  const camino = pts => pts.map((p, i) => { if (!i) return `M ${p[0]} ${p[1]}`; const a = pts[i - 1], dy = (p[1] - a[1]) / 2; return `C ${a[0]} ${a[1] + dy}, ${p[0]} ${p[1] - dy}, ${p[0]} ${p[1]}`; }).join(' ');
  svg.querySelector('.trazo-base').setAttribute('d', camino(puntos));
  const idx = [...cam.querySelectorAll('.nodo')].findIndex(n => n.classList.contains('abierto'));
  svg.querySelector('.trazo-hecho').setAttribute('d', idx > 0 ? camino(puntos.slice(0, idx + 1)) : '');
}
window.addEventListener('resize', () => requestAnimationFrame(dibujarCamino));

/* ---------- El reproductor (uno solo, al costado) ---------- */
let player = null, playerVid = null, ytCargando = false, simple = false;
function panelVideoHTML() {
  return `<aside class="panel-video" id="panel-video" aria-label="Video"><div class="pv-marco"><div id="yt"></div></div><p class="pv-titulo" id="pv-titulo"></p></aside>`;
}
function asegurarYT(cb) {
  if (simple || (window.YT && window.YT.Player)) return cb();
  const prev = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = () => { prev && prev(); cb(); };
  if (!ytCargando) {
    ytCargando = true;
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => { simple = true; cb(); };
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player) && !simple) { simple = true; cb(); } }, 4000);
  }
}
function sinSubtitulos(pl) { try { pl.unloadModule('captions'); } catch (e) {} try { pl.unloadModule('cc'); } catch (e) {} }
function ponerVideo(id, t = 0, play = false) {
  const tit = $('#pv-titulo'); if (tit) tit.textContent = VIDEOS[id] || '';
  if (simple || !(window.YT && window.YT.Player)) {
    const marco = $('#yt'); if (!marco) return;
    marco.outerHTML = `<iframe id="yt" src="https://www.youtube-nocookie.com/embed/${id}?rel=0&cc_load_policy=0&playsinline=1${t ? '&start=' + t : ''}${play ? '&autoplay=1' : ''}" title="${esc(VIDEOS[id] || 'Video')}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    playerVid = id; return;
  }
  if (!player) {
    player = new YT.Player('yt', { videoId: id, playerVars: { start: t, rel: 0, cc_load_policy: 0, playsinline: 1, modestbranding: 1 },
      events: { onReady: ev => { sinSubtitulos(ev.target); if (play) ev.target.playVideo(); },
                onApiChange: ev => sinSubtitulos(ev.target),
                onStateChange: ev => { if (ev.data === 1) sinSubtitulos(ev.target); } } });
  } else if (playerVid !== id) {
    play ? player.loadVideoById({ videoId: id, startSeconds: t }) : player.cueVideoById({ videoId: id, startSeconds: t });
  } else { player.seekTo(t, true); if (play) player.playVideo(); }
  playerVid = id;
}
function videoParaAbierto(cambioDePaso) {
  const v = PASO[abierto] && PASO[abierto].video;
  if (!v) return;
  if (v.id !== playerVid || (cambioDePaso && v.t)) asegurarYT(() => ponerVideo(v.id, v.t || 0, false));
}

/* ---------- Render ---------- */
function renderAlumno(animar) {
  const st = ST; const { e, lista } = recomendaciones(st, 3);
  if (!abierto || !PASO[abierto]) abierto = (lista[0] && lista[0].id) || ORDEN[0];
  if (!$('#vista') || animar) {
    player = null; playerVid = null;
    app().innerHTML = `${barra(st.nombre)}<div class="layout"><main class="alumno" id="vista"></main>${panelVideoHTML()}</div>`;
  }
  $('#vista').innerHTML = vistaHTML(st, e, animar);
  requestAnimationFrame(dibujarCamino);
  if (!playerVid) {
    const v = (PASO[abierto] && PASO[abierto].video) || [...ORDEN].reverse().map(id => PASO[id].video).find(Boolean) || { id: 'TylWJrfPxu0' };
    asegurarYT(() => ponerVideo(v.id, v.t || 0, false));
  }
  enlazarAlumno();
  enlazarFormStandard();
  if (animar) setTimeout(() => irA(abierto, false), 80);
}

function irA(id, suave = true) {
  const el = document.getElementById('n-' + id); if (!el) return;
  const pv = $('#panel-video');
  const tapa = window.innerWidth < 1000 && pv ? pv.offsetHeight : 0;
  const y = el.getBoundingClientRect().top + window.scrollY - 76 - tapa;
  window.scrollTo({ top: Math.max(0, y), behavior: suave && !reduceMotion ? 'smooth' : 'auto' });
}
function abrirPaso(id) {
  const cambio = id !== abierto;
  abierto = id; renderAlumno();
  videoParaAbierto(cambio);
  requestAnimationFrame(() => irA(id));
}

function enlazarAlumno() {
  const root = app();
  root.onclick = ev => {
    const b = ev.target.closest('button, input'); if (!b) return;
    const d = b.dataset;
    if (d.abrir) abrirPaso(d.abrir);
    else if (d.seek) { const [id, t] = d.seek.split(':'); asegurarYT(() => ponerVideo(id, +t || 0, true)); }
    else if (d.op) {
      const [id, opId] = d.op.split(':'); const o = opcionesProgreso(PASO[id]).find(x => x.id === opId);
      if (opcionElegida(ST, PASO[id]) === o) delete ST.prog[id];
      else ST.prog[id] = { hecho: true, como: o.nivel, op: o.id, t: hoyISO() };
      guardarAlumno(); renderAlumno();
    } else if (d.standard) {
      ST.standard = d.standard; ST.prog.p5 = { hecho: true, como: 'listo', t: hoyISO() };
      guardarAlumno(); renderAlumno();
    } else if (d.extra !== undefined && b.tagName === 'INPUT') {
      const x = ST.extras.find(x => x.id === d.extra); x.hecho = b.checked; guardarAlumno(); setTimeout(() => renderAlumno(), 250);
    } else if (d.accion === 'clase') {
      const k = (ST.clase || 0) + 1;
      $('#claseHecha').innerHTML = `<p>¿Marcás que ya tuviste la clase ${k}?</p><button class="primario" data-accion="clase-ok">Sí, ya la tuve</button> <button class="link" data-accion="clase-no">Todavía no</button>`;
    } else if (d.accion === 'clase-ok') {
      ST.clase = (ST.clase || 0) + 1; ST.claseFecha = hoyISO(); guardarAlumno(); abierto = null; renderAlumno(true);
    } else if (d.accion === 'clase-no') renderAlumno();
    else if (d.accion === 'deshacer-clase') { ST.clase = Math.max(0, ST.clase - 1); guardarAlumno(); renderAlumno(); }
    else if (d.accion === 'salir') salir();
    else if (d.accion === 'volver-admin') { abierto = null; abrirAdmin(); }
  };
}

function enlazarFormStandard() {
  const f = document.querySelector('[data-form-standard]'); if (!f) return;
  f.onsubmit = ev => { ev.preventDefault(); const v = new FormData(f).get('otro').trim(); if (!v) return;
    ST.standard = v; ST.prog.p5 = { hecho: true, como: 'listo', t: hoyISO() }; guardarAlumno(); renderAlumno(); };
}
function enfocar(sel) { requestAnimationFrame(() => { const el = $(sel); el && el.focus({ preventScroll: true }); }); }

function barra(nombre) {
  return `<header class="barra">
    <div class="marca">${LOGO}</div>
    <div class="barra-der">
      ${modo === 'admin-vista' ? `<button class="link" data-accion="volver-admin">Volver al panel</button>` : ''}
      ${nombre ? `<span class="quien">${esc(nombre)}</span>` : ''}
      ${modo !== 'admin-vista' && nombre ? `<button class="link suave" data-accion="salir">Salir</button>` : ''}
    </div>
  </header>`;
}

/* ---------------- Entrada ---------------- */
function renderEntrada(error) {
  app().innerHTML = `${barra('')}
  <main class="entrada">
    <h1>Tu mapa de Ajuste Elástico</h1>
    <p>Entrá con el código que te pasó Andy. Si abriste tu link personal, entra solo.</p>
    <form id="formEntrada">
      <label for="codigo">Tu código</label>
      <input id="codigo" name="codigo" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="por ejemplo: lucas-k7m2" required>
      ${error ? `<p class="error" role="alert">${esc(error)}</p>` : ''}
      <button class="primario" type="submit">Entrar</button>
    </form>
    ${!API_URL ? `<div class="demo">
      <p><strong>Modo de prueba.</strong> Todavía no está conectado a la planilla: lo que marques queda solo en este navegador.</p>
      <p>Alumnos de ejemplo:</p>
      <ul>${leerDemo().alumnos.map(a => `<li><button class="link" data-demo="${a.codigo}">${esc(a.nombre)}</button></li>`).join('')}</ul>
      <p><button class="link" data-demo-admin="1">Entrar al panel de Andy</button> · <button class="link suave" data-demo-reset="1">Reiniciar ejemplos</button></p>
    </div>` : `<p class="suave chico"><button class="link suave" data-demo-admin="1">Soy Andy</button></p>`}
  </main>`;
  $('#formEntrada').onsubmit = ev => { ev.preventDefault(); entrar($('#codigo').value); };
  app().onclick = ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.demo) entrar(b.dataset.demo);
    if (b.dataset.demoAdmin) pedirClave();
    if (b.dataset.demoReset) { llamar('demo.reset', {}).then(() => renderEntrada()); }
  };
}

async function entrar(codigo, animar = true) {
  try {
    const { alumno } = await llamar('alumno.get', { codigo: codigo.trim().toLowerCase() });
    ST = alumno; modo = 'alumno'; abierto = null;
    try { localStorage.setItem('mapaAE_codigo', ST.codigo); } catch (e) {}
    if (params.get('a') !== ST.codigo) nav('?a=' + encodeURIComponent(ST.codigo));
    renderAlumno(animar);
  } catch (e) { renderEntrada(e.message); }
}
function salir() { try { localStorage.removeItem('mapaAE_codigo'); } catch (e) {} ST = null; nav(location.pathname); renderEntrada(); }

/* ---------------- Panel de Andy ---------------- */
let LISTA = [];
let elegido = null;

function pedirClave() {
  if (!API_URL) { claveAdmin = 'demo'; abrirAdmin(); return; }
  app().innerHTML = `${barra('')}<main class="entrada"><h1>Panel de Andy</h1>
    <form id="formClave"><label for="clave">Clave</label><input id="clave" type="password" required><button class="primario">Entrar</button></form></main>`;
  $('#formClave').onsubmit = ev => { ev.preventDefault(); claveAdmin = $('#clave').value; try { sessionStorage.setItem('mapaAE_clave', claveAdmin); } catch (e) {} abrirAdmin(); };
}

async function abrirAdmin() {
  modo = 'admin';
  try { LISTA = (await llamar('admin.lista', { clave: claveAdmin })).alumnos; }
  catch (e) { claveAdmin = ''; try { sessionStorage.removeItem('mapaAE_clave'); } catch (_) {} renderEntrada(e.message); return; }
  nav('?admin');
  renderAdmin();
}

const ORDEN_TIPO = { meterle: 0, bien: 1, adelantado: 2, pausa: 3, m2: 4 };
function renderAdmin() {
  const filas = LISTA.map(a => ({ a, e: estado(a) })).sort((x, y) => ORDEN_TIPO[x.e.tipo] - ORDEN_TIPO[y.e.tipo] || x.a.nombre.localeCompare(y.a.nombre));
  const sel = elegido && LISTA.find(a => a.codigo === elegido);
  app().innerHTML = `${barra('Andy')}
  <main class="admin">
    <section class="lista">
      <div class="lista-cab"><h1>Alumnos</h1><button class="secundario" data-adm="nuevo">Agregar alumno</button></div>
      <table>
        <thead><tr><th>Alumno</th><th>Próxima</th><th>Estado</th><th>Nivel</th><th>Último movimiento</th></tr></thead>
        <tbody>${filas.map(({ a, e }) => {
          const nprob = Object.values(a.prog || {}).filter(x => x.hecho && x.como === 'cuesta').length;
          return `<tr class="${sel && sel.codigo === a.codigo ? 'sel' : ''}" data-elegir="${esc(a.codigo)}" tabindex="0">
            <td><strong>${esc(a.nombre)}</strong>${nprob ? `<span class="marca-prob" title="Pasos donde marcó que le cuesta">Le cuesta${nprob > 1 ? 'n ' + nprob + ' pasos' : ' 1 paso'}</span>` : ''}</td>
            <td class="nw">${e.k <= 4 ? 'Clase ' + e.k : 'Módulo 2'}</td>
            <td><span class="estado-chip t-${e.tipo}">${etiquetaAdmin(e)}</span></td>
            <td>${a.nivel}</td>
            <td class="suave">${a.act ? haceTanto(a.act) : 'sin movimiento'}</td>
          </tr>`; }).join('')}</tbody>
      </table>
    </section>
    <section class="detalle">${sel ? detalleHTML(sel) : elegido === '__nuevo' ? nuevoHTML() : '<p class="suave vacio">Elegí un alumno para ver su avance, ajustar el nivel o copiar el mensaje de lo que sigue.</p>'}</section>
  </main>`;
  enlazarAdmin();
}

function haceTanto(f) { const d = diasDesde(f); return d === 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`; }

function nuevoHTML() {
  return `<h2>Agregar alumno</h2>
  <form id="formNuevo" class="form-admin">
    <label>Nombre<input name="nombre" required placeholder="Nombre y apellido"></label>
    <label>Nivel <span class="suave">(el alumno no lo ve)</span>
      <select name="nivel"><option value="1">1: se lo compara con el mínimo</option><option value="2" selected>2: con lo esperado</option><option value="3">3: con lo ideal</option></select></label>
    <label>Fecha de la llamada de bienvenida<input type="date" name="inicio" value="${hoyISO()}"></label>
    <button class="primario">Crear y generar link</button>
  </form>`;
}

function detalleHTML(a) {
  const e = estado(a);
  const link = linkAlumno(a.codigo);
  const msg = mensajeWhatsApp(a, link);
  const probs = Object.entries(a.probs || {}).flatMap(([pid, l]) => l.map(q => ({ pid, q: (PASO[pid].problemas || []).find(x => x.id === q) })).filter(x => x.q));
  return `<div class="det-cab"><h2>${esc(a.nombre)}</h2><span class="estado-chip t-${e.tipo}">${etiquetaAdmin(e)}</span></div>
  <p class="suave">${esc(bajadaEstado(a, e))} ${e.pre ? `Lleva ${e.d} días desde la llamada.` : a.claseFecha ? `Tuvo la clase ${a.clase} ${haceTanto(a.claseFecha)}.` : ''}</p>

  <div class="mensaje">
    <div class="mensaje-cab"><h3>Mensaje de lo que sigue</h3>
      <span><button class="secundario" data-adm="copiar">Copiar</button>
      <a class="secundario boton" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Abrir en WhatsApp</a></span></div>
    <textarea id="msg" rows="10">${esc(msg)}</textarea>
    <p class="suave chico">Podés editarlo antes de copiar. Sale de lo que le falta según su nivel, de tu nota y de las tareas personalizadas.</p>
  </div>

  <div class="ajustes form-admin">
    <label>Nivel
      <span class="segmentado">${[1, 2, 3].map(n => `<button data-nivel="${n}" class="${a.nivel === n ? 'sel' : ''}" aria-pressed="${a.nivel === n}">${n}</button>`).join('')}</span></label>
    <label>Clases que ya tuvo
      <span class="segmentado">${[0, 1, 2, 3, 4].map(n => `<button data-clase="${n}" class="${a.clase === n ? 'sel' : ''}" aria-pressed="${a.clase === n}">${n}</button>`).join('')}</span></label>
    <label>Fecha de la última clase<input type="date" data-campo="claseFecha" value="${esc(a.claseFecha || '')}"></label>
    <label>Fecha de la llamada<input type="date" data-campo="inicio" value="${esc(a.inicio || '')}"></label>
    <label class="check"><input type="checkbox" data-campo="pausa" ${a.pausa ? 'checked' : ''}> En pausa (sin apuro, por ejemplo si se demora el pago)</label>
  </div>

  <label class="bloque">Nota para ${esc(a.nombre.split(' ')[0])} <span class="suave">(la ve en su mapa y va al final del mensaje)</span>
    <textarea data-campo="nota" rows="3">${esc(a.nota || '')}</textarea></label>

  <div class="bloque">
    <h3>Tareas personalizadas</h3>
    <ul class="extras-adm">${(a.extras || []).map(x => `<li class="${x.hecho ? 'hecha' : ''}"><span><strong>${esc(x.titulo)}</strong>${x.detalle ? ` <span class="suave">${esc(x.detalle)}</span>` : ''}</span><button class="link suave" data-quitar="${esc(x.id)}">Quitar</button></li>`).join('') || '<li class="suave">Ninguna por ahora.</li>'}</ul>
    <form id="formExtra" class="fila-extra"><input name="titulo" placeholder="Tarea (ej: repasar el compás 7 en 2 cuerdas)" required><input name="detalle" placeholder="Detalle (opcional)"><button class="secundario">Agregar</button></form>
  </div>

  ${probs.length ? `<div class="bloque"><h3>Problemas que marcó</h3><ul class="probs-adm">${probs.map(x => `<li><span class="suave">${esc(PASO[x.pid].titulo)}:</span> ${esc(x.q.q)}</li>`).join('')}</ul></div>` : ''}

  <div class="bloque">
    <h3>Avance</h3>
    <ul class="avance-adm">${PROGRAMA.pasos.map(p => { const pr = a.prog[p.id]; const est = pr && pr.hecho ? (pr.como || 'listo') : 'pendiente';
      return `<li class="est-${est}"><button class="mini-nodo" data-adm-tilde="${p.id}" aria-pressed="${!!(pr && pr.hecho)}" aria-label="Marcar ${esc(p.titulo)}"></button><span>${esc(p.titulo)}</span>${pr && pr.hecho ? (p.tipo === 'standard' && a.standard ? `<span class="como como-listo">${esc(a.standard)}</span>` : (opcionElegida(a, p) && !p.sinProgreso ? `<span class="como como-${est}">${esc(opcionElegida(a, p).label)}</span>` : '')) : e.faltan.includes(p.id) ? '<span class="chip">Le falta</span>' : ''}</li>`; }).join('')}</ul>
  </div>

  <div class="bloque links-adm">
    <button class="secundario" data-adm="link">Copiar su link</button>
    <button class="secundario" data-adm="ver">Ver su mapa</button>
    <button class="link suave" data-adm="borrar">Borrar alumno</button>
    <p class="suave chico">Código: <code>${esc(a.codigo)}</code></p>
  </div>`;
}

let timerAdm = null;
function guardarAdm(a, rerender = true) {
  aviso('Guardando…');
  if (rerender) renderAdmin();
  clearTimeout(timerAdm);
  timerAdm = setTimeout(async () => {
    try { await llamar('admin.guardar', { clave: claveAdmin, alumno: a }); aviso('Guardado'); }
    catch (e) { aviso('No se pudo guardar: ' + e.message, true); }
  }, 400);
}

function enlazarAdmin() {
  const root = app();
  const a = LISTA.find(x => x.codigo === elegido);
  root.onclick = async ev => {
    const tr = ev.target.closest('tr[data-elegir]');
    if (tr) { elegido = tr.dataset.elegir; renderAdmin(); if (window.innerWidth < 900) $('.detalle').scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth' }); return; }
    const b = ev.target.closest('button'); if (!b) return;
    const d = b.dataset;
    if (d.adm === 'nuevo') { elegido = '__nuevo'; renderAdmin(); }
    else if (d.adm === 'copiar') copiar($('#msg').value, b, 'Copiado');
    else if (d.adm === 'link') copiar(linkAlumno(a.codigo), b, 'Link copiado');
    else if (d.adm === 'ver') { ST = JSON.parse(JSON.stringify(a)); modo = 'admin-vista'; abierto = null; renderAlumno(true); window.scrollTo(0, 0); }
    else if (d.adm === 'borrar') {
      if (b.dataset.seguro) { await llamar('admin.borrar', { clave: claveAdmin, codigo: a.codigo }); LISTA = LISTA.filter(x => x !== a); elegido = null; renderAdmin(); }
      else { b.dataset.seguro = '1'; b.textContent = 'Tocá de nuevo para borrar'; }
    }
    else if (d.nivel) { a.nivel = +d.nivel; guardarAdm(a); }
    else if (d.clase) { a.clase = +d.clase; if (a.clase > 0 && !a.claseFecha) a.claseFecha = hoyISO(); guardarAdm(a); }
    else if (d.quitar) { a.extras = a.extras.filter(x => x.id !== d.quitar); guardarAdm(a); }
    else if (d.admTilde) {
      const id = d.admTilde; if (a.prog[id] && a.prog[id].hecho) delete a.prog[id]; else a.prog[id] = { hecho: true, como: 'listo', t: hoyISO() };
      guardarAdm(a);
    }
    else if (d.accion === 'salir') salir();
  };
  root.onchange = ev => {
    const c = ev.target.dataset.campo; if (!c || !a) return;
    a[c] = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value;
    guardarAdm(a, c !== 'nota');
  };
  const fn = $('#formNuevo');
  if (fn) fn.onsubmit = ev => {
    ev.preventDefault(); const f = new FormData(fn);
    const nuevo = alumnoVacio(f.get('nombre').trim(), +f.get('nivel'), f.get('inicio'));
    nuevo.codigo = codigoNuevo(nuevo.nombre); LISTA.push(nuevo); elegido = nuevo.codigo; guardarAdm(nuevo);
  };
  const fe = $('#formExtra');
  if (fe) fe.onsubmit = ev => {
    ev.preventDefault(); const f = new FormData(fe);
    a.extras = a.extras || []; a.extras.push({ id: 'x' + Date.now().toString(36), titulo: f.get('titulo').trim(), detalle: f.get('detalle').trim(), hecho: false });
    guardarAdm(a);
  };
}

async function copiar(txt, boton, ok) {
  try { await navigator.clipboard.writeText(txt); }
  catch (e) { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (_) {} t.remove(); }
  const prev = boton.textContent; boton.textContent = ok; setTimeout(() => (boton.textContent = prev), 1500);
}

/* ---------------- Arranque ---------------- */
let anchoPrevio = window.innerWidth;
window.addEventListener('resize', () => {
  if ((anchoPrevio < 600) !== (window.innerWidth < 600) && ST && modo !== 'admin') renderAlumno();
  anchoPrevio = window.innerWidth;
});

(function inicio() {
  if (params.has('admin')) { claveAdmin ? abrirAdmin() : pedirClave(); return; }
  let c = params.get('a');
  if (!c) { try { c = localStorage.getItem('mapaAE_codigo'); } catch (e) {} }
  c ? entrar(c) : renderEntrada();
})();

</script>
</body>
</html>
